name: 'Ally Accessibility Scanner'
description: 'Scan your codebase for accessibility violations using axe-core'
author: 'Elizabeth Stein'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  threshold:
    description: 'Maximum allowed violations before failing (default: 0)'
    required: false
    default: '0'
  url:
    description: 'URL to scan instead of files'
    required: false
  output:
    description: 'Output directory for reports'
    required: false
    default: '.ally'
  max-files:
    description: 'Limit scan to first N files (useful for large projects)'
    required: false
  baseline:
    description: 'Set current scan as baseline for future comparison'
    required: false
    default: 'false'
  compare-baseline:
    description: 'Compare against saved baseline and check for regressions'
    required: false
    default: 'false'
  fail-on-regression:
    description: 'Fail the workflow if accessibility regresses from baseline'
    required: false
    default: 'false'

outputs:
  score:
    description: 'Accessibility score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  violations:
    description: 'Total number of violations found'
    value: ${{ steps.scan.outputs.violations }}
  report:
    description: 'Path to the generated report'
    value: ${{ steps.scan.outputs.report }}
  improved:
    description: 'Number of files with improved accessibility (baseline mode)'
    value: ${{ steps.scan.outputs.improved }}
  regressed:
    description: 'Number of files with regressed accessibility (baseline mode)'
    value: ${{ steps.scan.outputs.regressed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '20'

    - name: Install ally from this checkout
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare pnpm@10.34.5 --activate
        pnpm install --frozen-lockfile
        pnpm run build:all
        mkdir -p "$HOME/.local/bin"
        printf '#!/bin/sh\nexec node %q "$@"\n' "${{ github.action_path }}/dist/cli.js" > "$HOME/.local/bin/ally"
        chmod +x "$HOME/.local/bin/ally"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run accessibility scan
      id: scan
      shell: bash
      env:
        ALLY_URL: ${{ inputs.url }}
        ALLY_PATH: ${{ inputs.path }}
        ALLY_MAX_FILES: ${{ inputs.max-files }}
        ALLY_BASELINE: ${{ inputs.baseline }}
        ALLY_COMPARE_BASELINE: ${{ inputs.compare-baseline }}
        ALLY_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        ALLY_OUTPUT: ${{ inputs.output }}
        ALLY_THRESHOLD: ${{ inputs.threshold }}
      run: |
        set -u
        args=(scan)
        if [ -n "${ALLY_URL:-}" ]; then
          args+=(--url "$ALLY_URL")
        else
          args+=("$ALLY_PATH")
        fi
        if [ -n "${ALLY_MAX_FILES:-}" ]; then
          args+=(--max-files "$ALLY_MAX_FILES")
        fi
        if [ "$ALLY_BASELINE" = "true" ]; then
          args+=(--baseline)
        fi
        if [ "$ALLY_COMPARE_BASELINE" = "true" ]; then
          args+=(--compare-baseline)
        fi
        if [ "$ALLY_FAIL_ON_REGRESSION" = "true" ]; then
          args+=(--fail-on-regression)
        fi
        args+=(-o "$ALLY_OUTPUT" --json)

        ally "${args[@]}" > scan-output.txt 2>&1 || SCAN_EXIT=$?

        NO_FILES_FOUND=false
        if [ -f "$ALLY_OUTPUT/scan.json" ]; then
          SCORE=$(jq -r '.summary.score // 0' "$ALLY_OUTPUT/scan.json")
          VIOLATIONS=$(jq -r '.summary.totalViolations // 0' "$ALLY_OUTPUT/scan.json")
        else
          SCORE=100
          VIOLATIONS=0
          NO_FILES_FOUND=true
          echo "::notice::No scannable HTML files found in $ALLY_PATH"
        fi

        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
        echo "report=$ALLY_OUTPUT/scan.json" >> "$GITHUB_OUTPUT"

        if [ "$ALLY_COMPARE_BASELINE" = "true" ]; then
          IMPROVED=$(grep -oP 'Improved:\s*\K\d+' scan-output.txt 2>/dev/null || echo "0")
          REGRESSED=$(grep -oP 'Regressed:\s*\K\d+' scan-output.txt 2>/dev/null || echo "0")
          echo "improved=$IMPROVED" >> "$GITHUB_OUTPUT"
          echo "regressed=$REGRESSED" >> "$GITHUB_OUTPUT"
          echo "Baseline Comparison:"
          echo "  Improved files: $IMPROVED"
          echo "  Regressed files: $REGRESSED"
        fi

        if [ "$NO_FILES_FOUND" = "true" ]; then
          exit 0
        fi

        if [ -n "${SCAN_EXIT:-}" ] && [ "$SCAN_EXIT" -ne 0 ]; then
          echo "::error::Accessibility scan failed with exit code $SCAN_EXIT"
          if [ "$ALLY_FAIL_ON_REGRESSION" = "true" ]; then
            echo "::error::Regressions detected in accessibility baseline comparison"
          fi
          exit "$SCAN_EXIT"
        fi

        if [ "$ALLY_FAIL_ON_REGRESSION" != "true" ] && [ "$VIOLATIONS" -gt "$ALLY_THRESHOLD" ]; then
          echo "::error::Accessibility check failed: $VIOLATIONS violations exceed threshold of $ALLY_THRESHOLD"
          exit 1
        fi

    - name: Generate report artifact
      shell: bash
      run: |
        if [ -f "${{ inputs.output }}/scan.json" ]; then
          ally report -o "${{ inputs.output }}/ACCESSIBILITY.md"
        else
          mkdir -p "${{ inputs.output }}"
          echo "# Accessibility Report" > "${{ inputs.output }}/ACCESSIBILITY.md"
          echo "" >> "${{ inputs.output }}/ACCESSIBILITY.md"
          echo "No HTML files found to scan." >> "${{ inputs.output }}/ACCESSIBILITY.md"
        fi
      
    - name: Comment on PR with results
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        SCORE=${{ steps.scan.outputs.score }}
        VIOLATIONS=${{ steps.scan.outputs.violations }}
        IMPROVED=${{ steps.scan.outputs.improved }}
        REGRESSED=${{ steps.scan.outputs.regressed }}
        
        # Build comment with results
        {
          echo "## ♿ Accessibility Report"
          echo ""
          echo "Score: \`$SCORE/100\`"
          echo "Violations: \`$VIOLATIONS\`"
          echo ""
          
          if [ -n "$IMPROVED" ] && [ "$IMPROVED" -gt 0 ]; then
            echo "✅ Improved: $IMPROVED files"
          fi
          
          if [ -n "$REGRESSED" ] && [ "$REGRESSED" -gt 0 ]; then
            echo "⚠️ Regressed: $REGRESSED files"
          fi
        } > /tmp/comment.txt
        
        # Post to PR if possible
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "GITHUB_TOKEN not available, skipping PR comment"
        else
          cat /tmp/comment.txt
        fi