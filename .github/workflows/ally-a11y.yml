name: Accessibility Check with Ally

on:
  pull_request:
    paths:
      - '**.html'
      - '**.tsx'
      - '**.jsx'
      - '**.vue'
      - 'src/**'
      - '.github/workflows/ally-a11y.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility:
    name: A11y Scan & Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      # Example 1: Basic scan with threshold
      - name: Scan for Critical Issues
        uses: ./
        continue-on-error: true
        with:
          path: ./src
          threshold: 0

      # Example 2: Large project with file limiting
      # (useful for monorepos to get fast feedback)
      - name: Quick Scan - First 100 Files
        id: quick-scan
        uses: ./
        continue-on-error: true
        with:
          path: ./src
          max-files: 100
          threshold: 5

      # Example 3: Establish baseline on main branch
      - name: Set Baseline on Main Branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./
        with:
          path: ./src
          baseline: true
          threshold: 0

      # Example 4: Check for regressions on PRs
      - name: Check Accessibility Regressions
        if: github.event_name == 'pull_request'
        id: regression-check
        uses: ./
        with:
          path: ./src
          compare-baseline: true
          fail-on-regression: true
        continue-on-error: true

      # Example 5: Post results as comment on PR
      - name: Comment on PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ALLY_SCORE: ${{ steps.quick-scan.outputs.score }}
          ALLY_VIOLATIONS: ${{ steps.quick-scan.outputs.violations }}
          ALLY_IMPROVED: ${{ steps.regression-check.outputs.improved }}
          ALLY_REGRESSED: ${{ steps.regression-check.outputs.regressed }}
        with:
          script: |
            const score = process.env.ALLY_SCORE || '0';
            const violations = process.env.ALLY_VIOLATIONS || '0';
            const improved = process.env.ALLY_IMPROVED || '0';
            const regressed = process.env.ALLY_REGRESSED || '0';
            
            let comment = `## ♿ Accessibility Report
            
            **Score:** \`${score}/100\`
            **Total Violations:** \`${violations}\`
            
            `;
            
            if (improved > 0) {
              comment += `✅ **Improved:** ${improved} files improved accessibility\n`;
            }
            
            if (regressed > 0) {
              comment += `⚠️ **Regressed:** ${regressed} files had accessibility decline\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # Upload report as artifact
      - name: Upload Accessibility Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ally-report
          path: .ally/ACCESSIBILITY.md
          retention-days: 30

  # Optional: Progressive scanning for very large projects
  large-project-scan:
    name: Large Project Accessibility Scan
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'large-project')
    
    strategy:
      matrix:
        chunk: [1, 2, 3, 4, 5]  # Scan in 5 parallel chunks
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Scan Files (Chunk ${{ matrix.chunk }})
        uses: ./
        with:
          path: ./src
          max-files: 200  # 200 files per chunk × 5 = 1000 files total
          threshold: 10
